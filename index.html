<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eaztrans集运｜产品原型</title>
  <link rel="stylesheet" href="merchant-workspace.css?v=10" />
  <link rel="stylesheet" href="combined-workspace.css?v=7" />
  <style>
    :root{
      --bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#6d7890;--line:#e6eaf1;
      --brand:#315efb;--brand-2:#1737a6;--green:#1d9a68;--amber:#c57a12;--red:#c54242;
      --shadow:0 12px 30px rgba(30,43,78,.08);--radius:16px;
    }
    *{box-sizing:border-box} [hidden]{display:none!important} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    button,input,select,textarea{font:inherit} button{cursor:pointer;border:0}
    .app{display:flex;min-height:100vh}.sidebar{width:248px;background:#101a36;color:#dce4ff;padding:22px 14px;display:flex;flex-direction:column;gap:18px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:4px 10px}.brand-mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#7e9cff,#315efb);display:grid;place-items:center;color:#fff}
    .role-switch{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:#1a2750;border-radius:12px;padding:4px}.role-switch button{padding:8px 3px;color:#aebcf0;background:transparent;border-radius:9px;font-size:12px}.role-switch button.active{background:#fff;color:#18326f;font-weight:700}
    .side-section{padding:0 8px}.side-label{font-size:11px;color:#8998cf;margin:4px 0 8px}.side-nav{display:grid;gap:3px}.side-nav button{background:transparent;color:#c3cff4;text-align:left;padding:9px 11px;border-radius:9px}.side-nav button:hover,.side-nav button.active{background:#23366c;color:#fff}.side-nav button .count{float:right;color:#91a7f2;font-size:12px}
    .side-footer{margin-top:auto;color:#8b9bd0;padding:0 10px;font-size:12px}.side-footer strong{display:block;color:#dbe4ff;margin-bottom:4px}
    .main{flex:1;min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:3}.crumb{color:var(--muted);font-size:13px}.top-actions{display:flex;align-items:center;gap:12px}.user{display:flex;gap:9px;align-items:center}.avatar{width:32px;height:32px;border-radius:50%;background:#e5ecff;color:#315efb;display:grid;place-items:center;font-weight:700}
    .content{max-width:1240px;padding:30px 34px 60px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:26px}.eyebrow{color:var(--brand);font-size:12px;font-weight:800;letter-spacing:.08em}.page-head h1{margin:5px 0 4px;font-size:28px;letter-spacing:-.02em}.page-head p{margin:0;color:var(--muted)}.head-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
    .btn{border-radius:10px;padding:10px 15px;font-weight:700;background:#eef2ff;color:#2449cd}.btn.primary{background:var(--brand);color:#fff;box-shadow:0 5px 14px rgba(49,94,251,.2)}.btn.ghost{background:#fff;border:1px solid var(--line);color:#53617a}.btn.danger{background:#fff0f0;color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}
    .grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}.kpi .label{color:var(--muted);font-size:13px}.kpi .value{font-size:28px;font-weight:800;margin-top:7px}.kpi .trend{font-size:12px;color:var(--green);margin-top:4px}.layout-2{grid-template-columns:1.35fr .9fr}.layout-3{grid-template-columns:repeat(3,1fr)}
    .card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.card-title h3{font-size:16px;margin:0}.card-title a{color:var(--brand);font-size:12px;cursor:pointer}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{text-align:left;color:#8290a8;font-size:12px;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}.table td{padding:13px 12px;border-bottom:1px solid #f0f2f6}.table tr:last-child td{border-bottom:0}.table tr.clickable{cursor:pointer}.table tr.clickable:hover{background:#f8faff}.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .status{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:700}.status.blue{color:#2f58d1;background:#e9efff}.status.green{color:#147a52;background:#e5f8ef}.status.amber{color:#9a5e0b;background:#fff2da}.status.gray{color:#66738a;background:#eef1f5}.status.red{color:#ad3535;background:#ffe8e8}
    .notice{display:flex;gap:11px;align-items:flex-start;background:#f0f5ff;border:1px solid #d9e3ff;color:#3555a9;padding:13px 14px;border-radius:12px;margin-bottom:16px}.notice strong{display:block;color:#1f3e9e}.notice p{margin:2px 0 0;font-size:13px}
    .steps{display:flex;align-items:flex-start;margin:8px 0 22px}.step{flex:1;position:relative;text-align:center;color:#96a2b7;font-size:12px}.step:before{content:"";width:27px;height:27px;border-radius:50%;display:grid;place-items:center;margin:0 auto 7px;background:#eef1f6;border:2px solid #dce1ea;color:#7d889b;font-weight:800}.step:after{content:"";position:absolute;top:13px;left:50%;right:-50%;height:2px;background:#e4e8ef;z-index:-1}.step:last-child:after{display:none}.step.done{color:#206c4e}.step.done:before{content:"✓";background:#dcf4e8;border-color:#8fd4b2;color:#17764b}.step.current{color:#2e54d0;font-weight:700}.step.current:before{content:"•";background:#e8edff;border-color:#7994ff;color:#315efb;font-size:24px;line-height:10px}.step.done:after{background:#99d8b8}
    .order-card{border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:#fff}.order-row{display:flex;justify-content:space-between;gap:12px;align-items:center}.order-id{font-weight:800}.amount{font-size:20px;font-weight:800}.subrow{display:flex;gap:15px;color:var(--muted);font-size:12px;margin-top:7px;flex-wrap:wrap}.tag{background:#f1f4f8;color:#61708a;padding:3px 8px;border-radius:6px;font-size:12px}
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#6d7890;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7893ff;box-shadow:0 0 0 3px #eaf0ff}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
    .timeline{display:grid;gap:0}.event{display:grid;grid-template-columns:24px minmax(0,1fr);gap:11px;position:relative;padding-bottom:20px;min-width:0}.event:last-child{padding-bottom:0}.event:before{display:none}.event>div:first-child{width:10px;height:10px;background:#315efb;border:3px solid #dce5ff;border-radius:50%;margin:4px 0 0 2px;z-index:1}.event:not(:last-child):after{content:"";position:absolute;top:14px;bottom:0;left:7px;width:2px;background:#e1e6f1}.event>div:last-child{min-width:0}.event h4{margin:0;font-size:13px;overflow-wrap:anywhere}.event p{margin:3px 0 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
    .split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}.check-list{display:grid;gap:10px}.check{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:10px}.check input{accent-color:var(--brand)}.photo{height:118px;border:1px dashed #b9c6e9;border-radius:12px;background:#f4f7ff;display:grid;place-items:center;color:#6f83c1}.metric{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f2f6}.metric:last-child{border:0}.metric b{font-size:16px}
    .empty{padding:36px;text-align:center;color:var(--muted)}.empty .icon{font-size:32px;margin-bottom:5px}.callout{border-radius:13px;background:linear-gradient(135deg,#f1f5ff,#fafbff);border:1px solid #dbe5ff;padding:18px}.callout h3{margin:0 0 5px}.callout p{margin:0;color:#60709a;font-size:13px}
    .toast{position:fixed;right:24px;bottom:24px;background:#132044;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:10}.toast.show{opacity:1;transform:translateY(0)}
    .modal{position:fixed;inset:0;background:rgba(15,25,52,.45);display:grid;place-items:center;z-index:20;padding:18px}.modal[hidden]{display:none}.modal-card{width:min(420px,100%);background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(15,25,52,.25)}.modal-card h3{margin:0 0 6px;font-size:20px}.modal-card p{margin:0 0 18px;color:var(--muted);font-size:13px}.modal-card .field{margin-top:12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
    .login-mode .sidebar,.login-mode .topbar{display:none}.login-mode .main{width:100%}.login-mode .content{max-width:none;padding:0}
    .login-page{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);background:linear-gradient(135deg,#0f1b3d 0%,#1d3c91 58%,#315efb 100%);color:#fff}.login-intro{display:flex;flex-direction:column;justify-content:center;padding:clamp(36px,8vw,110px);background:radial-gradient(circle at 18% 12%,rgba(126,156,255,.32),transparent 35%),linear-gradient(145deg,rgba(10,20,53,.22),rgba(25,61,152,.08))}.login-brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}.login-brand .brand-mark{background:linear-gradient(135deg,#aebdff,#fff);color:#1737a6}.login-intro h1{font-size:clamp(32px,4vw,58px);line-height:1.08;letter-spacing:-.04em;max-width:560px;margin:34px 0 16px}.login-intro>p{max-width:530px;color:#c9d5ff;font-size:16px;margin:0}.login-flow{display:grid;gap:12px;max-width:560px;margin-top:42px}.login-flow-item{display:flex;gap:12px;align-items:center;color:#e4eaff}.login-flow-item b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);color:#fff}.login-panel{display:flex;align-items:center;justify-content:center;padding:28px;background:rgba(255,255,255,.96);color:var(--ink)}.login-card{width:min(430px,100%);padding:clamp(22px,4vw,40px);background:#fff;border:1px solid #e7ebf5;border-radius:24px;box-shadow:0 22px 70px rgba(7,18,53,.22)}.login-card h2{margin:0 0 7px;font-size:26px}.login-card>p{margin:0;color:var(--muted);font-size:13px}.login-roles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:5px;background:#f2f5fb;border-radius:12px;margin:23px 0 18px}.login-roles button{padding:10px 4px;border-radius:9px;background:transparent;color:#6d7890;font-size:12px}.login-roles button.active{background:#fff;color:#2148cf;font-weight:800;box-shadow:0 3px 10px rgba(35,61,130,.12)}.login-submit{width:100%;margin-top:20px}.login-links{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;font-size:12px}.login-links button{background:transparent;color:#315efb;padding:0}.login-note{margin-top:22px;padding:11px 12px;border-radius:10px;background:#f5f7fc;color:#6d7890;font-size:12px}
    .flow-list{display:grid;gap:10px}.flow-item{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}.flow-item.current{border-color:#b8c8ff;background:#f7f9ff}.flow-item.done{border-color:#b8e2cb;background:#f3fbf6}.flow-index{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eef1f6;color:#7d889b;font-weight:800}.flow-item.current .flow-index{background:#e8edff;color:#315efb}.flow-item.done .flow-index{background:#dcf4e8;color:#17764b}.flow-copy{flex:1}.flow-copy b{display:block}.flow-copy span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
    @media(max-width:980px){.sidebar{width:210px}.content{padding:24px}.kpis{grid-template-columns:repeat(2,1fr)}.layout-2,.split{grid-template-columns:1fr}}
    @media(max-width:680px){.app{display:block}.sidebar{width:100%;padding:12px;gap:10px}.side-section,.side-footer{display:none}.role-switch{max-width:360px}.topbar{padding:0 16px}.content{padding:20px 15px}.page-head{display:block}.head-actions{margin-top:15px}.kpis{grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px}.form-grid{grid-template-columns:1fr}.layout-3{grid-template-columns:1fr}.table th,.table td{padding:10px 8px}.login-page{display:block;min-height:100vh}.login-intro{padding:32px 22px 28px}.login-intro h1{font-size:34px;margin-top:25px}.login-flow{margin-top:24px;gap:8px}.login-panel{padding:20px 14px;align-items:flex-start}.login-card{border-radius:18px}.login-roles{grid-template-columns:1fr 1fr 1fr}}
  </style>
</head>
<body>
  <div class="app" id="appShell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">E</span><span>Eaztrans集运</span></div>
      <div class="role-switch">
        <button data-role="merchant" class="active">商家端</button>
        <button data-role="warehouse">仓库端</button>
        <button data-role="admin">运营后台</button>
      </div>
      <div class="side-section">
        <div class="side-label">工作台</div>
        <div id="nav" class="side-nav"></div>
      </div>
      <div class="side-footer"><strong>试运营原型 v2.2</strong>角色独立登录 · 头程尾程独立结算</div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="crumb">集运系统 / <span id="crumb">商家控制台</span></div><div class="top-actions"><span class="muted" id="envLabel">演示环境</span><button class="btn ghost small" id="authBtn">登录</button><div class="user"><span class="avatar" id="avatar">商</span><span id="userName">跨境商家</span></div></div></header>
      <section id="content" class="content"></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <div id="authModal" class="modal" hidden>
    <div class="modal-card">
      <h3 id="authTitle">账号登录</h3>
      <p id="authHint">商家、仓库操作员和管理员均从这里登录，系统按账号权限进入对应工作台。</p>
      <div class="field"><label id="authIdentifierLabel">会员号 / 邮箱</label><input id="authIdentifier" type="text" placeholder="M12345678 或 name@company.com" autocomplete="username" /></div>
      <div class="field"><label>密码</label><input id="authPassword" type="password" placeholder="至少 6 位" /></div>
      <p id="authSignupNote" class="muted" hidden style="margin:12px 0 0;font-size:12px">注册仅需邮箱和密码；注册成功后系统会生成会员号，之后可用会员号或邮箱登录。</p>
      <div class="modal-actions"><button class="btn ghost" id="authCancel">取消</button><button class="btn ghost" id="authResend">重发验证邮件</button><button class="btn ghost" id="authMode">注册账号</button><button class="btn primary" id="authSubmit">登录</button></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=forwarding-1"></script>
  <script>
    const state = {
      role:'merchant', page:'dashboard',
      auth:{user:null,mode:'login',role:null,profile:null,pending:null,pendingRole:null,loginTargetRole:'merchant'},
      order:{id:'SH20261016001', status:'待仓库确认', payment:'待付款', parcels:3, confirmed:0, estimated:268, confirmedAmount:null, paidAmount:null, packed:false, shipped:false, consolidated:false},
      parcels:[
        {no:'YT238901221',name:'服装样品',status:'已入库',weight:'1.20 kg',size:'32×24×10 cm'},
        {no:'SF102993845',name:'家居配件',status:'已测量',weight:'0.85 kg',size:'28×18×12 cm'},
        {no:'JD882310114',name:'美妆用品',status:'待预报',weight:'—',size:'—'}
      ],
      addresses:[], adminOrders:[], dbOrders:[], activeOrderId:null, auditLogs:[], pricing:null, selectedException:null,
      exceptions:[
        {id:'EX-20261018-01',object:'JD882310114',type:'无法匹配入库单号',status:'待人工确认',tone:'red',detail:'仓库扫描后未找到对应的商家预报包裹。请核对快递单号，或联系商家补充预报。'},
        {id:'EX-20261017-03',object:'SH20261015009',type:'超尺寸',status:'待商家确认',tone:'amber',detail:'包裹外箱尺寸超过当前线路限制，需要商家确认加固、拆分或改用其他线路。'}
      ],
      events:[
        {title:'已创建集运订单',desc:'商家提交了目的地、线路和 3 个预报包裹',time:'10月16日 09:20',done:true},
        {title:'仓库确认中',desc:'等待仓库核对包裹、实际重量和尺寸',time:'当前',current:true},
        {title:'确认费用并付款',desc:'确认后展示唯一应付金额，商家只需付款一次',time:'待处理'},
        {title:'打包出货',desc:'仓库打包完成后进入待出货',time:'待处理'},
        {title:'运输与签收',desc:'商家在线查看物流节点',time:'待处理'}
      ]
    };
    const navs = {
      merchant:[
        ['dashboard','首页'],['parcels','我的包裹'],['orders','我的订单'],['receivers','地址管理'],['rates','运价查询'],['messages','消息与客服'],['profile','我的账户']
      ],
      warehouse:[
        ['dashboard','仓库工作台'],['inbound','入库扫描'],['confirm','包裹确认'],['packing','拣货 / 合包 / 打包'],['ship','出货登记'],['warehouse-tracking','物流查询'],['exceptions','异常处理']
      ],
      admin:[
        ['dashboard','运营看板'],['orders','订单与异常'],['config','渠道 / 箱型 / 运价'],['audit','审计日志'],['support-admin','客服工单'],['accounts','商家与仓库账号']
      ]
    };
    const $ = s=>document.querySelector(s);
    const esc = s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    function toast(msg,duration=2200){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),duration)}
    function status(text,kind='blue'){return '<span class="status '+kind+'">'+esc(text)+'</span>'}
    const roleLabels={merchant:'商家端',warehouse_operator:'仓库端',admin:'运营后台'};
    const statusLabels={draft:'草稿',submitted:'待仓库收货',warehouse_received:'仓库已收货',measuring:'确认实重尺寸中',awaiting_payment:'待付款',paid:'已付款待打包',ready_to_ship:'待出货',shipped:'运输中',delivered:'已签收',cancelled:'已取消',exception:'异常'};
    function orderStatusLabel(value){return statusLabels[value]||value||'待仓库确认'}
    function statusTone(value){return ['paid','shipped','delivered'].includes(value)?'green':['awaiting_payment','ready_to_ship','measuring','warehouse_received'].includes(value)?'amber':['exception','cancelled'].includes(value)?'red':'blue'}
    function feeRecord(order){return Array.isArray(order?.fees)?(order.fees[0]||null):(order?.fees||null)}
    function paymentRecord(order){return Array.isArray(order?.payments)?(order.payments[0]||null):(order?.payments||null)}
    function formatWeight(value){return value==null?'—':Number(value).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:3,useGrouping:false})+' kg'}
    function formatSize(parcel){return parcel?.length_cm&&parcel?.width_cm&&parcel?.height_cm?`${parcel.length_cm}×${parcel.width_cm}×${parcel.height_cm} cm`:'—'}
    function applyDbOrder(latest){
      const fee=feeRecord(latest), payment=paymentRecord(latest);
      state.activeOrderId=latest.id; state.order.dbId=latest.id; state.order.id=latest.order_no; state.order.status=latest.status;
      state.order.statusLabel=orderStatusLabel(latest.status); state.order.parcels=latest.parcel_count||0;
      state.order.estimated=Number(fee?.estimated_total||0); state.order.confirmedAmount=fee?.total_amount==null?null:Number(fee.total_amount);
      state.order.shippingFee=fee?.shipping_fee==null?null:Number(fee.shipping_fee); state.order.handlingFee=fee?.handling_fee==null?null:Number(fee.handling_fee);
      state.order.billableWeight=fee?.billable_weight_kg==null?null:Number(fee.billable_weight_kg); state.order.actualWeight=fee?.actual_weight_kg==null?null:Number(fee.actual_weight_kg); state.order.volumeWeight=fee?.volume_weight_kg==null?null:Number(fee.volume_weight_kg);
      state.order.paidAmount=payment?.amount==null?null:Number(payment.amount); state.order.payment=payment?.status==='paid'?'已付款':'待付款';
      state.order.packed=latest.status==='ready_to_ship'||latest.status==='shipped'||Boolean(latest.packed_at);
      state.order.shipped=latest.status==='shipped'||latest.status==='delivered';
      state.order.consolidated=Boolean(latest.consolidated);
      state.order.record=latest;
      state.order.boxNo=latest.box_no||null; state.order.carrier=latest.shipment_carrier||null; state.order.shipmentTrackingNo=latest.shipment_tracking_no||null;
      const rows=(latest.order_parcels||[]).map(x=>x.parcels||x.parcel).filter(Boolean);

    async function submitLandingAuth(){

    function go(page,options={}){

      if(!state.auth.user&&authRequired(page,targetRole)){
        state.auth.pending={page,role:targetRole,parcelNo:options.parcelNo||null,exceptionId:options.exceptionId||null};

    async function syncAuth(){

          const latest=currentDbOrder(orders);
          applyDbOrder(latest);
          try{applyTracking(await window.MospaceSupabase.orderTracking(latest.id));}catch(trackingError){console.info('物流轨迹暂不可读',trackingError.message)}
        }
        await loadMerchantWorkspace();
        if(nextPage)state.page=nextPage;
        render();
        return true;
      }catch(error){toast('刷新订单失败：'+(error.message||'请稍后重试'));return false}
    }
    function bind(){
      document.querySelectorAll('[data-login-role]').forEach(b=>b.onclick=()=>{state.auth.loginTargetRole=b.dataset.loginRole;render()});
      const landingSubmit=$('#loginSubmit');if(landingSubmit)landingSubmit.onclick=submitLandingAuth;
      const landingRegister=$('#loginRegister');if(landingRegister)landingRegister.onclick=()=>{state.auth.mode='signup';state.auth.pendingRole='merchant';openAuth({role:'merchant'})};
      document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>switchRole(b.dataset.role));
      document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page,{parcelNo:b.dataset.parcelNo,exceptionId:b.dataset.exception}));
      const authBtn=$('#authBtn');if(authBtn)authBtn.onclick=async()=>{if(state.auth.user){await window.MospaceSupabase.signOut();state.auth.user=null;state.auth.profile=null;state.auth.role=null;state.auth.pending=null;state.auth.pendingRole=null;state.role='merchant';state.page='dashboard';toast('已退出登录');render()}else{state.auth.pending=null;state.auth.pendingRole=state.role;openAuth({role:state.role})}};
      const create=$('#createOrderBtn');if(create)create.onclick=async()=>{
        if(window.MospaceSupabase.isConfigured()){
          if(!state.auth.user){toast('请先登录商家账号');openAuth();return}
          try{
            const selectedNos=[...document.querySelectorAll('.parcel-choice:checked')].map(el=>el.dataset.parcelNo);
            const parcels=state.parcels.filter(p=>selectedNos.includes(p.no)).map(p=>({no:p.no,name:p.name}));
            if(!parcels.length){toast('至少选择一个预报包裹');return}
            const order=await window.MospaceSupabase.createMerchantOrder({
              destinationCountry:$('#destinationCountry')?.value||'印度尼西亚',destinationCity:'雅加达',
              destinationAddress:$('#destinationAddress')?.value.trim(),
              recipientName:$('#recipientName')?.value.trim(),recipientPhone:$('#recipientPhone')?.value.trim(),
              parcels,estimatedFee:state.order.estimated
            });
            state.activeOrderId=order.id;state.order.id=order.order_no;state.order.dbId=order.id;state.order.status='submitted';state.order.statusLabel='待仓库收货';
            state.order.consolidated=false;toast('订单已写入数据库：'+order.order_no);await refreshDbState('parcels');
          }catch(error){toast('订单写入失败：'+(error.message||'请稍后重试'));console.error(error)}
        }else{toast('预报已完成，请到我的包裹确认合包');state.activeOrderId='demo-order';state.order.dbId='demo-order';go('parcels',{role:'merchant'})}
      };
      const consolidation=$('#confirmConsolidationBtn');if(consolidation)consolidation.onclick=()=>{
        const selected=[...document.querySelectorAll('.merge-choice:checked')];
        if(!selected.length){toast('至少选择一个要合包的包裹');return}
        state.order.consolidated=true;toast('合包方案已确认，进入订单费用流程');go('fee',{role:'merchant'});
      };
      const confirm=$('#confirmBtn');if(confirm)confirm.onclick=async()=>{
        if(window.MospaceSupabase.isConfigured()&&state.auth.user&&state.order.dbId){
          try{
            const measurements=[...document.querySelectorAll('.measure-row')].map(row=>({
              parcel_no:row.dataset.parcelNo,
              actual_weight_kg:Number(row.querySelector('.measure-weight')?.value),
              length_cm:Number(row.querySelector('.measure-length')?.value),
              width_cm:Number(row.querySelector('.measure-width')?.value),
              height_cm:Number(row.querySelector('.measure-height')?.value)
            }));
            const fee=await window.MospaceSupabase.warehouseConfirmMeasurements(state.order.dbId,measurements);
            toast('已生成唯一应付金额 ¥'+Number(fee.total_amount).toFixed(2));await refreshDbState('dashboard');
          }catch(error){toast('确认失败：'+(error.message||'请先完成入库'));console.error(error)}
        }else{state.order.confirmed=state.parcels.length;state.order.confirmedAmount=292;state.order.status='awaiting_payment';state.order.statusLabel='待付款';state.events[1]={title:'仓库已完成确认',desc:'全部包裹已核对实重和尺寸',time:'刚刚',done:true};toast('已确认包裹，生成唯一应付金额 ¥292');go('dashboard',{role:'warehouse'})}
      };
      const pack=$('#packBtn');if(pack)pack.onclick=async()=>{
        if(window.MospaceSupabase.isConfigured()&&state.auth.user&&state.order.dbId){try{await window.MospaceSupabase.warehousePackOrder(state.order.dbId,$('#boxNo')?.value,$('#packageNote')?.value);toast('打包记录已写入，订单进入待出货');await refreshDbState('ship')}catch(error){toast('打包失败：'+(error.message||'请稍后重试'))}}
        else{state.order.packed=true;state.order.status='ready_to_ship';state.order.statusLabel='待出货';toast('打包完成，订单进入待出货');go('ship',{role:'warehouse'})}
      };
      const ship=$('#shipBtn');if(ship)ship.onclick=async()=>{
        if(window.MospaceSupabase.isConfigured()&&state.auth.user&&state.order.dbId){try{await window.MospaceSupabase.warehouseShipOrder(state.order.dbId,$('#carrier')?.value,$('#shipmentTrackingNo')?.value);toast('出货记录已写入，已生成物流节点');await refreshDbState('ship')}catch(error){toast('出货失败：'+(error.message||'请先完成打包'))}}
        else{state.order.shipped=true;state.order.status='shipped';state.order.statusLabel='运输中';toast('出货登记成功，已生成物流节点');go('ship',{role:'warehouse'})}
      };
      const resolveException=$('#resolveExceptionBtn');if(resolveException)resolveException.onclick=()=>{const item=state.exceptions.find(e=>e.id===state.selectedException);if(item){item.status='已处理';item.tone='green';toast('异常处理结果已记录');render()}};
      const match=$('#matchBtn');if(match)match.onclick=async()=>{
        if(window.MospaceSupabase.isConfigured()&&state.auth.user){try{const result=await window.MospaceSupabase.warehouseFindOrderByTracking($('#trackingInput')?.value);if(!result.order){await rpcWorkspace('warehouse_receive_parcel',{p_parcel_id:result.parcel.id});toast('独立包裹已入库，商家可继续申请合包');await refreshDbState('inbound');return}applyDbOrder(result.order);await window.MospaceSupabase.warehouseReceiveOrder(result.order.id);toast('已匹配并完成深圳仓收货登记');await refreshDbState('confirm')}catch(error){toast('匹配失败：'+(error.message||'请检查单号'))}}
        else{$('#matchResult').innerHTML='<div class="notice" style="margin:0"><div>✓</div><div><strong>演示环境：匹配成功</strong><p>登录仓库账号后会按真实快递单号查询数据库。</p></div></div>'}
      };
      const save=$('#saveConfigBtn');if(save)save.onclick=async()=>{
        if(!window.MospaceSupabase.isConfigured()||!state.auth.user){toast('请先登录管理员账号');return}
        try{state.pricing=await window.MospaceSupabase.updateRoutePricing({routeCode:$('#pricingRouteCode').value,routeName:$('#pricingRouteName').value,firstWeightKg:$('#pricingFirstWeight').value,firstPrice:$('#pricingFirstPrice').value,additionalPricePerKg:$('#pricingAdditional').value,volumeDivisor:$('#pricingDivisor').value,handlingFee:$('#pricingHandling').value,notes:$('#pricingNotes').value});toast('运价已保存并写入审计日志');render()}catch(error){toast('保存失败：'+(error.message||'请确认管理员权限'))}
      };
      const copyWarehouse=$('#copyWarehouseBtn');if(copyWarehouse)copyWarehouse.onclick=async()=>{try{await navigator.clipboard.writeText('广东省深圳市龙岗区平湖街道物流园 2 号楼 1 楼\n收件人：Eaztrans 深圳仓收货组\n电话：0755-8888-1688');toast('深圳仓地址已复制')}catch(error){toast('浏览器未授权剪贴板，请手动复制')}};
      const saveAddress=$('#saveAddressBtn');if(saveAddress)saveAddress.onclick=async()=>{
        if(!state.auth.user){toast('请先登录商家账号');return}
        const label=$('#addressLabel').value.trim(), recipient=$('#addressRecipient').value.trim(), phone=$('#addressPhone').value.trim(), city=$('#addressCity').value.trim(), line=$('#addressLine').value.trim();
        if(!recipient||!phone||!line){toast('请填写收件人、电话和详细地址');return}
        try{await window.MospaceSupabase.saveAddress({label:label||'默认收货地址',recipient_name:recipient,recipient_phone:phone,country:'印度尼西亚',city:city||'雅加达',address_line:line,is_default:state.addresses.length===0});state.addresses=await window.MospaceSupabase.listAddresses();toast('收件地址已保存');render()}catch(error){toast('保存地址失败：'+(error.message||'请稍后重试'))}
      };
      const cancel=$('#authCancel');if(cancel)cancel.onclick=closeAuth;
      const mode=$('#authMode');if(mode)mode.onclick=()=>{
        if(state.auth.mode==='login'&&(state.auth.pendingRole||state.role)!=='merchant'){toast('仓库和管理员账号由平台创建，不能自行注册');return}
        state.auth.mode=state.auth.mode==='login'?'signup':'login';updateAuthMode()
      };
      const submit=$('#authSubmit');if(submit)submit.onclick=submitAuth;
      const resend=$('#authResend');if(resend)resend.onclick=async()=>{const email=$('#authIdentifier').value.trim();if(!email){toast('请先填写注册邮箱');return}try{await window.MospaceSupabase.resendConfirmation(email);toast('验证邮件已重新发送，请检查垃圾箱')}catch(error){toast('发送失败：'+(error.message||'请稍后重试'))}};
    }

  </script>
